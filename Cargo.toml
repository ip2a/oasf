[package]
name = "oasf"
version = "0.1.3"
edition = "2021"
authors = ["oasf contributors"]
description = "Open Agent Session Format — a vendor-neutral schema for AI agent session transcripts"
license = "Apache-2.0"
repository = "https://github.com/ip2a/oasf"
readme = "README.md"
keywords = ["ai", "agent", "session", "transcript", "format"]
categories = ["data-structures", "encoding"]
exclude = ["/target", "/Cargo.lock"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
